<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinspurCode | Bringing ideas to life</title>
    <style>
        :root {
            --bg: #000000;
            --accent: #d8b4fe;
            --text: #ffffff;
            --muted: #a1a1aa;
            --whatsapp-green: #25D366;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        main {
            max-width: 800px;
            padding: 5rem 2rem;
            text-align: center;
            flex-grow: 1;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.5rem;
            color: var(--accent);
            font-style: italic;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .intro {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--muted);
            margin-bottom: 3rem;
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--accent); /* Light Purple */
            color: var(--bg); /* Black text */
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .whatsapp-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(216, 180, 254, 0.4);
        }

        .whatsapp-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--bg);
        }

        /* Services Grid */
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 4rem 0;
        }

        .card {
            border: 1px solid #222;
            padding: 1.5rem;
            border-radius: 10px;
        }

        .card h3 {
            color: var(--accent);
            margin: 0;
        }

        /* Footer */
        footer {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #666;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            fill: var(--accent);
            transition: opacity 0.3s;
        }

        .social-icons a:hover { opacity: 0.7; }

        @media (max-width: 600px) {
            footer { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>
